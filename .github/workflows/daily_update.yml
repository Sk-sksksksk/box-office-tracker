name: Daily Box Office Auto Update

on:
  schedule:
    # Runs everyday at 05:00 UTC (10:30 AM IST)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openpyxl

      - name: Run automated box office updater
        run: |
          python auto_update.py

      - name: Commit updated workbook and site files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add box_office_tracker.xlsx site/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily box office update [skip ci]" && git push)

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'
